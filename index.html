<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>library challenge</title>
</head>
<body>
    <div id="library-flame">
        <div class="top-bar__column">
            <i class="fa-solid fa-bars-staggered"></i>
            <span>library</span>
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <div class="search-bar__column">
            <input type="text" placeholder="Search books..." />
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="book-of-the-day__column">
            <h1>Book of the day</h1>
            <div class="book">
            <div class="book__cover">
                <img src="image/book.jpg" alt="No image">
            </div>
            <div class="book__info">
                <span>No Fixed Abode</span>
                <span>Journey Through</span>      
                <div class="book__stars">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star star--empty"></i>
                </div>
                <div class="book__tags">
                    <span>Journey</span>
                    <span>Biography</span>     
                </div>
                <div class="book__choice">
                    <div class="book__bookmark">            
                    <i class="fa-solid fa-bookmark"></i>
                    </div>
                    <input type="submit" value="Book Now" />
                </div>
            </div>
            </div>

        </div>
        <div class="top-adventures__column">
            <h1>Top Adventures</h1>
            <div class="adventure__list">
                <div class="adventure">                
                    <div class="adventure__cover">
                    <img src="image/book1.jpg" alt="No image">
                    </div>
                    <div class="adventure__stars">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star star--empty"></i>
                    </div>
                </div>    
                <div class="adventure">   
                    <div class="adventure__cover">
                        <img src="image/book2.jpg" alt="No image">
                    </div>
                    <div class="adventure__stars">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star star--empty"></i>
                    </div>
                </div>
                <div class="adventure">               
                    <div class="adventure__cover">
                        <img src="image/book3.jpg" alt="No image">
                    </div>
                    <div class="adventure__stars">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star star--empty"></i>
                    </div>
                </div>
                <div class="adventure">                
                    <div class="adventure__cover">
                        <img src="image/book4.jpg" alt="No image">
                    </div>
                    <div class="adventure__stars">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star star--empty"></i>
                    </div>
                </div>   
            </div>
        </div>        
        <div class="popular-authors__column">
            <h1>Popular-authors</h1>
            <div class="authors"> 
                <div class="author">
                    <img src="image/authors.jpg" alt="No image">
                </div>  
                <div class="authors__info">
                    <span>George Raymond Richard Martin</span>
                    <p>Modern American science fiction writer, screenwriter, producer and editor, winner of many literary awards.</p>
                </div>
            </div>  
        </div>
    </div>   
</body>
<script src="https://kit.fontawesome.com/acccf4e870.js" crossorigin="anonymous"></script>
</html>
